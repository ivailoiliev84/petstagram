
{% load static %}

<link rel="stylesheet" href="{% static 'chatbot/css/chat.css' %}">

<div id="pet-chat">
    <button
        id="chat-toggle"
        type="button"
        aria-label="Open AI chat"
        aria-expanded="false"
        aria-controls="chat-widget"
    >
        💬
    </button>

    <section id="chat-widget" hidden>
        <header class="chat-header">
            <h3>🐾 Petstagram AI</h3>

            <button
                id="chat-close"
                type="button"
                aria-label="Close chat"
            >
                ✕
            </button>
        </header>

        <div
            id="chat-messages"
            role="log"
            aria-live="polite"
            aria-relevant="additions"
        ></div>

        <form id="chat-form">
            {% csrf_token %}

            <input
                id="chat-input"
                type="text"
                placeholder="Ask Petstagram AI..."
                maxlength="2000"
                aria-label="Chat message"
                required
            >

            <button id="send-button" type="submit">
                Send
            </button>
        </form>
    </section>
</div>
